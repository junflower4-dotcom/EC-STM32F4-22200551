; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

#[env:nucleo_f411re]
#platform = ststm32
#board = nucleo_f411re
#framework = cmsis

[platformio]
src_dir = .
include_dir = include

[env]
platform = ststm32
board = nucleo_f411re
framework = cmsis
debug_tool = stlink
build_flags = -Wl,-u,_printf_float,-u,_scanf_float -std=c11 -O3

[env:TU_CreateProject_Example1]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c>

[env:TU_GPIO_Digital_Out_LED]
build_src_filter = +<tutorial/TU_GPIO_Digital_Out_LED_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_GPIO_Digital_InOut_Button]
build_src_filter = +<tutorial/TU_GPIO_Digital_InOut_Button_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_DIO_LED_Photosensor]
build_src_filter = +<lab/LAB_GPIO_DIO_LED_Photosensor_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_DIO_multiLED]
build_src_filter = +<lab/LAB_GPIO_DIO_multiLED_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_GPIO_7segment]
build_src_filter = +<tutorial/TU_GPIO_7segment.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_7segment]
build_src_filter = +<lab/LAB_GPIO_7segment_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_7segment_P2]
build_src_filter = +<lab/LAB_GPIO_7segment_P2_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_SysTic]
build_src_filter = +<tutorial/TU_SysTic.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_EXTI]
build_src_filter = +<tutorial/TU_EXTI_student.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_EXTI]
build_src_filter = +<lab/LAB_EXTI_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_Stepper_Motor]
build_src_filter = +<lab/LAB_Stepper_Motor_22200551.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_USART_ex1]
